name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连推多次只跑最后一次，PR 也是一样
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          bash --version | head -1
          git --version
          python3 --version

      - name: 跑测试
        run: bash tests/run.sh